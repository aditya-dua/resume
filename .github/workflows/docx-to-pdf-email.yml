name: DOCX to PDF and Email

on:
  push:

permissions:
  contents: read

jobs:
  convert-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Find changed DOCX files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-pdf

          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"

          if [[ -n "$BEFORE_SHA" ]] && [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -Ei '\.docx$' > changed_docx.txt || true
          else
            find . -maxdepth 2 -type f -name "*.docx" > changed_docx.txt
          fi

          if [[ ! -s changed_docx.txt ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_files=true" >> "$GITHUB_OUTPUT"
          tr '\n' ',' < changed_docx.txt | sed 's/,$//' > changed_docx_csv.txt
          echo "docx_files=$(cat changed_docx_csv.txt)" >> "$GITHUB_OUTPUT"

      - name: Convert DOCX to PDF
        if: steps.files.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r docx; do
            [[ -z "$docx" ]] && continue
            soffice --headless --convert-to pdf --outdir generated-pdf "$docx"
          done < changed_docx.txt

      - name: Collect PDF attachments
        if: steps.files.outputs.has_files == 'true'
        id: pdfs
        shell: bash
        run: |
          set -euo pipefail
          ls -1 generated-pdf/*.pdf > generated_pdf.txt
          tr '\n' ',' < generated_pdf.txt | sed 's/,$//' > generated_pdf_csv.txt
          echo "attachments=$(cat generated_pdf_csv.txt)" >> "$GITHUB_OUTPUT"

      - name: Send email with PDF (Brevo API)
        if: steps.files.outputs.has_files == 'true'
        shell: bash
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESUME_EMAIL_FROM: ${{ secrets.RESUME_EMAIL_FROM }}
          RESUME_EMAIL_TO: ${{ secrets.RESUME_EMAIL_TO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          DOCX_FILES: ${{ steps.files.outputs.docx_files }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          attachments = []
          with open("generated_pdf.txt", "r", encoding="utf-8") as f:
              for line in f:
                  file_path = line.strip()
                  if not file_path:
                      continue
                  p = Path(file_path)
                  attachments.append(
                      {
                          "name": p.name,
                          "content": base64.b64encode(p.read_bytes()).decode("utf-8"),
                      }
                  )

          payload = {
              "sender": {
                  "email": os.environ["RESUME_EMAIL_FROM"],
                  "name": "Resume Automation",
              },
              "to": [{"email": os.environ["RESUME_EMAIL_TO"]}],
              "subject": f"Updated resume PDF(s) from {os.environ['GITHUB_REPOSITORY']} @ {os.environ['GITHUB_SHA']}",
              "textContent": (
                  "Resume PDF conversion completed.\n"
                  f"Repository: {os.environ['GITHUB_REPOSITORY']}\n"
                  f"Commit: {os.environ['GITHUB_SHA']}\n"
                  f"Changed DOCX file(s): {os.environ['DOCX_FILES']}"
              ),
              "attachment": attachments,
          }

          with open("brevo_payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

          curl --fail --silent --show-error \
            -X POST "https://api.brevo.com/v3/smtp/email" \
            -H "accept: application/json" \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "content-type: application/json" \
            --data @brevo_payload.json
